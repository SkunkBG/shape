# Сервер мониторинга Shape.
#
# Наружу смотрит ровно один контейнер — caddy. Остальные три доступны только
# внутри сети docker и портов не публикуют: если Grafana или хранилище
# однажды окажутся доступны напрямую, гейт впереди перестанет что-либо
# значить, а заметить это можно будет только по последствиям.
#
# Образы прибиты к версиям намеренно. Конфигурация Authelia менялась между
# 4.37 и 4.38 несовместимо, и «latest» однажды утром просто не поднимется.

name: shape-monitor

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Домены, почта и токен записи приходят из .env — в Caddyfile их нет.
      #
      # ACME_EMAIL обязателен. Без него Caddy берёт умолчание из Caddyfile —
      # admin@localhost, — а Let's Encrypt отказывает: «Domain name needs at
      # least one dot». Ошибка вылезает только на живом сервере и выглядит
      # так, будто виноват домен, а не забытая переменная.
      ACME_EMAIL: ${ACME_EMAIL:?нужен ACME_EMAIL}
      SHAPE_DOMAIN: ${SHAPE_DOMAIN:?нужен SHAPE_DOMAIN}
      SHAPE_PUSH_TOKEN: ${SHAPE_PUSH_TOKEN:?нужен SHAPE_PUSH_TOKEN}
    depends_on:
      - grafana
      - victoriametrics
      - authelia
    networks: [inside]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/data"
      - "-httpListenAddr=:8428"
      # Год хранения. 28 нод дают порядка семисот рядов — это десятки
      # мегабайт на диске, ограничивать раньше времени незачем.
      - "-retentionPeriod=12"
      # Дедупликация на случай, если нода отправит один и тот же замер
      # дважды: таймер с разбросом иногда стреляет плотнее обычного.
      - "-dedup.minScrapeInterval=30s"
    volumes:
      - vm-data:/data
    networks: [inside]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?нужен GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${SHAPE_DOMAIN}
      # Свой вход у Grafana остаётся включённым. Гейт впереди — первый слой,
      # а не замена: два пароля это и есть смысл затеи.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Дашборд лежит в каталоге ноды и подкладывается как есть: две копии
      # одного файла разъезжаются, и разъезжается всегда та, что не под рукой.
      - ../grafana/shape-dashboard.json:/var/lib/grafana/dashboards/shape.json:ro
    networks: [inside]

  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    environment:
      # Секреты приходят переменными, а не лежат в configuration.yml:
      # конфиг попадает в репозиторий, переменные — нет.
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?нужен AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?нужен AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?нужен AUTHELIA_JWT_SECRET}
      X_AUTHELIA_CONFIG_FILTERS: template
      SHAPE_DOMAIN: ${SHAPE_DOMAIN}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users.yml:/config/users.yml:ro
      - authelia-data:/data
    networks: [inside]

networks:
  inside:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  vm-data:
  grafana-data:
  authelia-data:
