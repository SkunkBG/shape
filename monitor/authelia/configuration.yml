# Конфигурация Authelia под тег 4.38.
#
# Секретов здесь нет ни одного: session secret, ключ шифрования хранилища и
# jwt приходят переменными окружения (AUTHELIA_*). Конфиг лежит в
# репозитории, переменные — в .env, который в репозиторий не попадает.
#
# Схема между 4.37 и 4.38 менялась несовместимо, поэтому образ прибит к
# версии. Перед первым запуском конфиг стоит проверить:
#
#   docker compose run --rm authelia authelia validate-config \
#       --config /config/configuration.yml

theme: dark

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info
  format: text

authentication_backend:
  # Файл, а не база и не LDAP: пользователь здесь один — владелец нод.
  # Ставить ради него postgres значит добавить ещё одну вещь, которая
  # может не подняться утром.
  password_reset:
    disable: true
  file:
    path: /config/users.yml
    password:
      algorithm: argon2

access_control:
  # Всё, что явно не разрешено, запрещено.
  #
  # Правило одно и требует пароля — без второго фактора. Второй фактор тут
  # был, и его убрали после первой живой установки: почтового сервера нет,
  # поэтому коды подтверждения приходилось доставать из файла внутри
  # контейнера, а на регистрацию устройства уходило шесть шагов и две
  # консоли. Защита, которой невозможно пользоваться, не защищает — ею
  # просто перестают пользоваться.
  #
  # Слоёв всё равно два: пароль гейта и собственный вход Grafana. Снаружи
  # по-прежнему не видно, что за гейтом стоит.
  #
  # Вернуть второй фактор: заменить one_factor на two_factor и настроить
  # notifier.smtp, чтобы коды приходили письмом.
  default_policy: deny
  rules:
    - domain: 'grafana.{{ env "SHAPE_DOMAIN" }}'
      policy: one_factor

session:
  name: authelia_session
  # Час бездействия и сутки жизни: вы в разъездах, и слишком короткий срок
  # означал бы вход заново на каждой пересадке.
  expiration: 24h
  inactivity: 1h
  cookies:
    - domain: '{{ env "SHAPE_DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "SHAPE_DOMAIN" }}'
      default_redirection_url: 'https://grafana.{{ env "SHAPE_DOMAIN" }}'

regulation:
  # Пять неудачных попыток — пауза на пять минут. От подбора это не спасает
  # само по себе, но делает его бессмысленно медленным.
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  # Писем никуда не шлём: почтового сервера нет, а заводить его ради одного
  # пользователя незачем. Коды подтверждения при заведении второго фактора
  # ложатся в файл, который читается изнутри контейнера.
  filesystem:
    filename: /data/notification.txt
